spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trading_pair_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,metrics

binance.symbol=${BINANCE_SYMBOL:BNBUSDT}
binance.poll-interval=${BINANCE_POLL_INTERVAL:PT5M}
binance.base-url=${BINANCE_BASE_URL:https://api.binance.com}
binance.scheduling.enabled=${BINANCE_SCHEDULING_ENABLED:true}
